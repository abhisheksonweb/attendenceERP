{% extends "base.html" %}
{% block title %}Register &middot; Face Attendance{% endblock %}
{% block nav_register %}active{% endblock %}

{% block content %}
<div class="auth-wrap">
  <section class="card auth-card">
    <div class="card-head"><h2>Register as Admin</h2></div>
    <p class="hint">Create an admin account. You can then register classes and add students.</p>
    <form method="post" action="{{ url_for('register') }}" class="form">
      <label>
        Username
        <input type="text" name="username" required autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" name="password" required autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
    <p class="hint">Already registered? <a class="link" href="{{ url_for('login') }}">Login</a>.</p>
  </section>
</div>
{% endblock %}
